# إعدادات Netlify — موقع ثابت بدون بناء
[build]
  publish = "."
  command = "echo ok"

# أي مسار لا يطابق ملفاً منشوراً → صفحة 404 مخصصة (404.html في الجذر)
# force=false (الافتراضي): لا يطغى على index.html والملفات الموجودة
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
